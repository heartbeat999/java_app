<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>测试前端网页</title>
  <style>
    body {
      font-family: -apple-system, "PingFang SC", sans-serif;
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
      color: #333;
      background: #fafafa;
    }
    h1 { color: #2c3e50; }
    .card {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-top: 20px;
    }
    a { color: #3498db; }
  </style>
</head>
<body>
  <h1>欢迎来到我的网页</h1>
  <div class="card">
    <p>这是一个简单的 HTML 页面示例。</p>
    <p>你可以修改标题、文字和样式来定制它。</p>
  </div>
</body>
</html>
